# Maintien en éveil de la base Supabase (14/11/2026).
# Le projet Supabase gratuit se met en pause après une semaine sans activité : l'application
# devient alors injoignable (« mot de passe incorrect » pour tout le monde). Chaque jour, on
# interroge l'application, qui interroge la base. En cas d'échec, le passage est marqué en
# rouge et GitHub prévient par e-mail : c'est l'alerte qu'il faut relancer le projet.
name: Base Idawa éveillée

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours vers 6h17 heure de Cotonou
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Interroger la base via l'application
        run: |
          for essai in 1 2 3; do
            code=$(curl -s -o reponse.json -w "%{http_code}" https://idawa-capital.vercel.app/api/keepalive || echo 000)
            echo "Essai $essai : HTTP $code — $(cat reponse.json 2>/dev/null)"
            if [ "$code" = "200" ] && grep -q '"ok":true' reponse.json; then exit 0; fi
            sleep 30
          done
          echo "::error::La base Idawa ne répond pas : vérifier le projet sur supabase.com/dashboard (pause ?)."
          exit 1
